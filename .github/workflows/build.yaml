# the "github release" part of this build workflow spec: credits to qhadron https://github.com/qhadron/Easy7-Zip-SF LGPL-2.1
name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - easy7zip-sf
      - e7z-sf-zstd
      - e7z-sf-without-zstd
  pull_request:
    branches:
      - easy7zip-sf
      - e7z-sf-zstd
      - e7z-sf-without-zstd

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build project
        shell: cmd
        run: ${{ '"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" && build.cmd' }}

      - name: Download and unpack Lang
        shell: cmd
        run: ${{ 'cd out && curl -L -o official.exe.7z "https://sourceforge.net/projects/sevenzip/files/latest/download" && .\7z x official.exe.7z Lang/ License.txt && DEL official.exe.7z' }}

      - name: Pack
        shell: cmd
        run: ${{ 'cd out && COPY 7zipUninstall.exe Uninstall.exe && .\7z a -m0=LZMA -mx=9 install.7z Lang/ 7z.dll 7z.exe 7z.sfx 7zCon.sfx 7zFM.exe 7zG.exe 7-zip.dll Uninstall.exe License.txt && RENAME 7zipInstall.exe 7zipInstall.exe.bak && COPY /Y /B 7zipInstall.exe.bak + install.7z 7zipInstall.exe && DEL Uninstall.exe && DEL install.7z' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easy_7zip_Artifact
          path: |
            ./out/*
            !./out/*/*

      - name: Create ZIP archive for GitHub Release
        run: |
          Compress-Archive -Path "./out/*" -DestinationPath "./Easy7-Zip-SF-Release.zip" -Force
        shell: pwsh

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: github_run_${{ github.run_number }}
          name: "Release GitHub Run ${{ github.run_number }}"
          body: "Automated release generated by GitHub Actions."
          draft: false
          prerelease: false
          files: ./Easy7-Zip-SF-Release.zip
